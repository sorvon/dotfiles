theme = "nordfox"

[editor]
shell = ["nu", "--stdin", "-c"]
cursorline = true
line-number = "relative"
auto-format = true
end-of-line-diagnostics = "hint"
default-yank-register = "+"

[editor.clipboard-provider.custom]
yank = { command = "nu", args = ["~/.local/bin/clipcli.nu", "get"] }
paste = { command = "nu", args = ["--stdin", "~/.local/bin/clipcli.nu", "set"] }

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.indent-guides]
render = true

[editor.cursor-shape]
insert = "bar"

[keys.normal]
x = "select_line_below"
X = "select_line_above"
"-" = "switch_to_lowercase"
"_" = "switch_to_uppercase"


[keys.normal."\\"]
# scooter
s = [
    ':write-all',
    ':sh $nu.temp-dir | path join helix_path | rm -f $in',
    ":open %sh{ echo %sh{ zellij run -i -c --blocking -- scooter --editor-command `nu -c 'echo %%file o> ($nu.temp-dir | path join helix_path)'` }; $nu.temp-dir | path join helix_path | cat $in }",
]

# lazygit
g = [':write-all', ':sh let _ = zellij run -i -c --blocking -- lazygit']

# yazi file
y = [
    ':write-all',
    ':sh $nu.temp-dir | path join helix_path | rm -f $in',
    ":open %sh{ echo %sh{ zellij run -i -c --blocking -- yazi %sh{ '%{buffer_name}' | path expand } --chooser-file %sh{ $nu.temp-dir | path join helix_path } }; $nu.temp-dir | path join helix_path | cat $in }",
]

# yazi pwd
Y = [
    ':write-all',
    ':sh $nu.temp-dir | path join helix_path | rm -f $in',
    ":open %sh{ echo %sh{ zellij run -i -c --blocking -- yazi %sh{ pwd } --chooser-file %sh{ $nu.temp-dir | path join helix_path } }; $nu.temp-dir | path join helix_path | cat $in }",
]

[keys.normal."\\".u]
s = ":toggle soft-wrap.enable"

# git
[keys.normal."\\".G]
b = ":sh git log -n 5 --format='format:%%h (%%an: %%ar) %%s' --no-patch -L%{cursor_line},+1:%{buffer_name}"

# runner
[keys.normal."\\".r]
r = [
    ':write-all',
    ":sh nu '~/.local/bin/code_runner.nu' '%{buffer_name}' '%{language}' %{cursor_line}",
]
